<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="description" content="Every operational deadline and rhythm at the Maastricht Science Programme, in one staff calendar with subscribable Outlook feeds.">
<meta name="theme-color" content="#001c3d">
<link rel="icon" type="image/png" href="msp-logo.png">
<title>MSP Operations Calendar</title>
<style>
  /* Source Sans 3, variable, self-hosted (SIL Open Font Licence). Two files cover latin and latin-ext. */
  @font-face { font-family: 'Source Sans 3'; font-style: normal; font-weight: 400 700; font-display: swap;
    src: url('fonts/sourcesans3-latin-ext.woff2') format('woff2');
    unicode-range: U+0100-02BA, U+02BD-02C5, U+02C7-02CC, U+02CE-02D7, U+02DD-02FF, U+0304, U+0308, U+0329, U+1D00-1DBF, U+1E00-1E9F, U+1EF2-1EFF, U+2020, U+20A0-20AB, U+20AD-20C0, U+2113, U+2C60-2C7F, U+A720-A7FF; }
  @font-face { font-family: 'Source Sans 3'; font-style: normal; font-weight: 400 700; font-display: swap;
    src: url('fonts/sourcesans3-latin.woff2') format('woff2');
    unicode-range: U+0000-00FF, U+0131, U+0152-0153, U+02BB-02BC, U+02C6, U+02DA, U+02DC, U+0304, U+0308, U+0329, U+2000-206F, U+20AC, U+2122, U+2191, U+2193, U+2212, U+2215, U+FEFF, U+FFFD; }

  /* ---------- Tokens (design handoff, 28 Sep 2026) ---------- */
  :root {
    --navy: #001c3d; --navy-2: #2d5a8a; --navy-3: #9aabbf;
    --sky: #0e71bb; --sky-tint: #e8f3fb; --sky-ring: #e4f3ff; --sky-sel: #c5e7ff; --sky-next: #f2f8fd; --sky-week: #eaf2fa;
    --ink: #1c2333; --body-2: #334964; --body-3: #4a5b70; --muted: #66778b; --faint: #8593a6; --faint-2: #9aa6b5; --faint-3: #b2bbc5;
    --line: #ebedef; --line-2: #e3e7ec; --line-3: #eceff2; --line-4: #eef0f3; --line-in: #d5dbe2;
    --surface: #f5f7f9; --holiday: #eef6f0; --gap: #e9ecf0;
    --rail-w: 220px; --rail-txt: #b9c6d9; --rail-lab: #8ea4c6; --rail-div: rgba(255,255,255,.12); --rail-hover: rgba(255,255,255,.06);
    --gold: #af6500; --gold-txt: #8a4f00; --gold-bg: #fffaf1; --gold-bd: #ecd9b8; --gold-cell: #fdefd6; --gold-tag: #fbeed6;
    --p1: #001c3d; --p2: #2d5a8a; --p3: #9aabbf; --p4: #001c3d; --p5: #2d5a8a; --p6: #9aabbf;
    --exams: #0e71bb; --esd: #15817e; --scheduling: #b8741a; --btr: #2e7d5b; --boe: #6a50a7; --general: #66778b;
    --scrim: rgba(0,28,61,.18); --panel-shadow: 0 0 40px rgba(0,28,61,.18);
    --r: 4px; --r-s: 3px;
  }
  * { box-sizing: border-box; }
  html { scroll-behavior: smooth; }
  body { margin: 0; background: #fff; color: var(--ink); font-family: 'Source Sans 3', system-ui, sans-serif; font-size: 14px;
    line-height: 1.45; -webkit-font-smoothing: antialiased; font-variant-numeric: tabular-nums; }
  a { color: var(--sky); } a:hover { color: var(--navy); }
  ::selection { background: var(--sky-sel); }
  input::placeholder { color: #7a889a; }
  button { font: inherit; color: inherit; }
  :focus-visible { outline: 2px solid #df362f; outline-offset: 2px; }
  [role="button"] { cursor: pointer; }

  .layout { display: flex; min-height: 100vh; }
  .content { flex: 1 1 auto; min-width: 0; display: flex; flex-direction: column; }

  /* ---------- Sidebar ---------- */
  .rail { width: var(--rail-w); flex: 0 0 var(--rail-w); background: var(--navy); color: #fff; display: flex; flex-direction: column;
    padding: 26px 0 24px; position: sticky; top: 0; height: 100vh; overflow-y: auto; overflow-x: hidden; z-index: 30;
    transition: width .2s ease, flex-basis .2s ease; }
  .rail::-webkit-scrollbar { width: 6px; } .rail::-webkit-scrollbar-thumb { background: rgba(255,255,255,.16); border-radius: 3px; }
  .railtop { display: flex; align-items: flex-start; justify-content: space-between; padding: 0 22px; margin-bottom: 24px; gap: 8px; }
  .raillogo { width: 148px; height: auto; filter: brightness(0) invert(1); display: block; }
  .railtoggle { display: none; background: transparent; border: 1px solid var(--rail-div); color: var(--rail-lab); width: 26px; height: 26px;
    border-radius: var(--r); cursor: pointer; align-items: center; justify-content: center; flex: 0 0 auto; padding: 0; font-size: 12px; }
  .railtoggle:hover { color: #fff; background: var(--rail-hover); }
  .brand { padding: 0 22px 22px; margin-bottom: 22px; border-bottom: 1px solid var(--rail-div); display: flex; flex-direction: column; gap: 3px; }
  .brand .eyebrow { font-size: 10px; font-weight: 600; letter-spacing: .14em; text-transform: uppercase; color: var(--rail-lab); }
  .brand .name { font-size: 17px; font-weight: 700; letter-spacing: -.01em; line-height: 1.25; }
  .brand .yr { margin-top: 8px; font-size: 12px; color: var(--rail-txt); }
  .raillabel { display: flex; justify-content: space-between; align-items: baseline; padding: 0 22px 8px;
    font-size: 11px; font-weight: 600; letter-spacing: .1em; text-transform: uppercase; color: var(--rail-lab); }
  .raillabel button { background: transparent; border: 0; padding: 0; font-size: 11px; color: var(--rail-lab); cursor: pointer; letter-spacing: 0; text-transform: none; }
  .raillabel button:hover { color: #fff; }
  .railsec { display: flex; flex-direction: column; margin-bottom: 24px; }
  .railitem { display: flex; align-items: center; gap: 10px; width: 100%; text-align: left; background: transparent; border: 0;
    padding: 8px 22px; font-size: 14px; color: var(--rail-txt); cursor: pointer; transition: background .12s ease, color .12s ease; }
  .railitem:hover { background: var(--rail-hover); }
  .railitem.nav.on { color: #fff; font-weight: 600; background: rgba(255,255,255,.07); box-shadow: inset 3px 0 0 #fff; }
  .railitem.sub { font-size: 13px; padding: 6px 22px; color: var(--rail-lab); }
  .railitem.sub.on { color: #fff; font-weight: 600; }
  .railitem .lb { flex: 1 1 auto; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .railitem .ct { font-size: 12px; color: var(--rail-lab); }
  .railitem .odot { width: 9px; height: 9px; border-radius: 50%; flex: 0 0 auto; border: 2px solid var(--c); background: transparent; }
  .railitem.on .odot { background: var(--c); }
  .railitem .ring { width: 12px; height: 12px; border-radius: 50%; border: 2px solid var(--rail-lab); display: inline-flex; align-items: center; justify-content: center; flex: 0 0 auto; }
  .railitem .ring::after { content: ""; width: 4px; height: 4px; border-radius: 50%; background: transparent; }
  .railitem.on .ring { border-color: #fff; } .railitem.on .ring::after { background: #fff; }
  .railspring { flex: 1 1 auto; min-height: 24px; }
  .railsub { margin: 0 22px; padding-top: 20px; border-top: 1px solid var(--rail-div); display: flex; flex-direction: column; gap: 10px; }
  .subscribe { display: block; background: var(--sky); border-radius: var(--r); padding: 10px 0; text-align: center; font-size: 13px; font-weight: 600;
    color: #fff; text-decoration: none; border: 0; cursor: pointer; width: 100%; transition: background .15s ease, color .15s ease; }
  .subscribe:hover { background: #fff; color: var(--navy); }
  .railsub small { font-size: 11px; line-height: 1.5; color: var(--rail-lab); }
  /* Collapsed rail: phones, and a manual choice anywhere */
  .rail.mini { --rail-w: 56px; padding: 14px 0 16px; cursor: pointer; }
  .rail.mini .raillogo, .rail.mini .brand, .rail.mini .raillabel, .rail.mini .railitem .lb, .rail.mini .railitem .ct,
  .rail.mini .railsub small, .rail.mini .railitem.nav, .rail.mini .railitem.sub .ring { display: none; }
  .rail.mini .railtop { padding: 0; justify-content: center; margin-bottom: 14px; }
  .rail.mini .railtoggle { display: inline-flex; }
  .rail.mini .railitem { justify-content: center; padding: 7px 0; }
  .rail.mini .railsec { margin-bottom: 12px; }
  .rail.mini .railsub { margin: 0 8px; padding-top: 12px; }
  .rail.mini .subscribe { font-size: 0; padding: 9px 0; }
  .rail.mini .subscribe::before { content: "\2709"; font-size: 14px; }

  /* ---------- Page header ---------- */
  .pagehead { display: flex; flex-wrap: wrap; gap: 14px 24px; align-items: flex-end; justify-content: space-between;
    padding: 26px 32px 20px; border-bottom: 1px solid var(--line); }
  .phbrand { display: flex; align-items: center; gap: 16px; min-width: 0; }
  /* msp-logo.png is a 472x478 mark on a 1290x730 transparent canvas; crop the padding away */
  .mspmark { width: 56px; height: 56px; overflow: hidden; flex: 0 0 auto; display: block; }
  .mspmark img { display: block; height: 79px; margin: -11.5px -42px; }
  .phleft { display: flex; flex-direction: column; gap: 4px; min-width: 0; }
  .crumb { font-size: 12px; color: var(--muted); } .crumb i { font-style: normal; color: var(--faint-3); margin: 0 6px; }
  .crumb a { color: var(--muted); text-decoration: none; } .crumb a:hover { color: var(--navy); }
  .pagehead h1 { margin: 0; font-size: 26px; line-height: 1.2; font-weight: 700; letter-spacing: -.015em; color: var(--navy); }
  .viewdesc { font-size: 14px; color: var(--body-3); text-wrap: pretty; }
  .phright { display: flex; align-items: center; gap: 10px; font-size: 13px; }
  .search { width: 240px; height: 36px; border: 1px solid var(--line-in); border-radius: var(--r); padding: 0 12px; font: inherit; font-size: 13px;
    color: var(--ink); outline: none; background: #fff; transition: border-color .12s ease, box-shadow .12s ease; }
  .search:focus { border-color: var(--sky); box-shadow: 0 0 0 3px var(--sky-ring); }
  .btn { height: 36px; display: inline-flex; align-items: center; padding: 0 14px; border: 1px solid var(--line-in); border-radius: var(--r);
    font-weight: 600; color: var(--navy); background: #fff; cursor: pointer; transition: border-color .12s ease; }
  .btn:hover { border-color: var(--navy); }

  /* ---------- Year bar ---------- */
  .ybar { padding: 40px 32px 0; display: flex; flex-direction: column; gap: 8px; }
  .ybrow { position: relative; display: flex; gap: 2px; }
  .ybseg { flex-basis: 0; display: flex; flex-direction: column; gap: 6px; min-width: 0; }
  .ybseg .bar { position: relative; height: 8px; border-radius: 1px; background: var(--c, var(--gap)); overflow: hidden; }
  .ybseg .bar i { position: absolute; top: 0; bottom: 0; background: var(--sky); }
  .ybseg .lab { font-size: 11px; font-weight: 700; color: var(--navy); }
  .ybtoday { position: absolute; top: -6px; height: 20px; width: 3px; background: var(--gold); }
  .ybtoday b { position: absolute; top: -27px; left: 6px; font-size: 10px; font-weight: 700; letter-spacing: .04em; text-transform: uppercase; color: var(--gold); white-space: nowrap; }
  .ybtoday.late b { left: auto; right: 6px; }
  .ybticks { position: relative; height: 14px; margin-top: -2px; }
  .ybticks span { position: absolute; top: 0; font-size: 10px; color: var(--faint); padding-left: 4px; border-left: 1px solid var(--line-in); line-height: 14px; }
  .ybstatus { display: flex; flex-wrap: wrap; gap: 8px 16px; justify-content: space-between; font-size: 12px; color: var(--muted); }
  .ybstatus .lgs { display: flex; gap: 16px; }
  .lg { display: inline-flex; align-items: center; gap: 6px; }
  .lg i { display: inline-block; }

  /* ---------- Main ---------- */
  main { padding: 22px 32px 48px; display: flex; flex-direction: column; }
  main.chains { padding-top: 26px; gap: 26px; max-width: 1240px; }
  main.lanes { gap: 14px; }
  .eyebrow { font-size: 11px; font-weight: 700; letter-spacing: .12em; text-transform: uppercase; color: var(--muted); }
  .eyebrow.gold { color: var(--gold-txt); }
  .empty { color: var(--muted); font-size: 14px; padding: 40px 0; text-align: center; }
  #printstamp { display: none; padding: 4px 32px 0; font-size: 12px; font-weight: 700; color: var(--navy); }

  /* Key deadline cards */
  .keyblock { display: flex; flex-direction: column; gap: 10px; margin-bottom: 22px; }
  .keygrid { display: grid; grid-template-columns: repeat(auto-fit, minmax(230px, 1fr)); gap: 12px; }
  .keycard { border: 1px solid var(--gold-bd); background: var(--gold-bg); border-radius: var(--r); padding: 14px 16px 14px 18px; display: flex; flex-direction: column;
    gap: 6px; cursor: pointer; box-shadow: inset 4px 0 0 var(--gold); transition: border-color .12s ease; text-align: left; }
  .keycard:hover { border-color: var(--gold); }
  .keycard .top { display: flex; justify-content: space-between; align-items: center; gap: 8px; }
  .keycard .when { font-size: 20px; font-weight: 700; color: var(--navy); }
  .keycard .rel { font-size: 12px; font-weight: 700; white-space: nowrap; padding: 2px 8px; border-radius: var(--r-s); color: var(--gold-txt); }
  .keycard .rel.soon { background: var(--gold); color: #fff; }
  .keycard .kind { font-size: 11px; font-weight: 700; letter-spacing: .08em; text-transform: uppercase; color: var(--gold-txt); }
  .keycard .title { font-size: 13px; line-height: 1.4; color: var(--body-2); text-wrap: pretty; }

  /* Year grid */
  .ywrap { overflow-x: auto; }
  .ygrid { min-width: 1040px; display: flex; flex-direction: column; gap: 1px; background: var(--line-2); border: 1px solid var(--line-2); }
  .yrow { display: grid; grid-template-columns: 56px repeat(31, minmax(0, 1fr)); gap: 1px; }
  .ymonth { background: var(--surface); display: flex; flex-direction: column; justify-content: center; padding-left: 10px; cursor: pointer; }
  .ymonth b { font-size: 13px; font-weight: 700; color: var(--navy); } .ymonth small { font-size: 10px; color: var(--muted); }
  .ycell { position: relative; height: 54px; padding: 4px 4px 0; background: #fff; display: flex; flex-direction: column; gap: 1px; cursor: pointer;
    box-shadow: inset 0 2px 0 var(--top, transparent), inset 0 0 0 2px var(--ring, transparent); transition: box-shadow .12s ease; }
  .ycell:hover { box-shadow: inset 0 0 0 1px var(--sky); }
  .ycell.out { background: transparent; cursor: default; box-shadow: none; } .ycell.out:hover { box-shadow: none; }
  .ycell.wknd { background: var(--surface); } .ycell.hol { background: var(--holiday); } .ycell.exam { background: var(--sky-tint); } .ycell.key { background: var(--gold-cell); }
  .ycell .n { flex-shrink: 0; align-self: flex-start; font-size: 12px; font-weight: 700; line-height: 1.1; padding: 1px 3px; margin: -1px -3px 0; border-radius: 2px; color: var(--ink); }
  .ycell.wknd .n { color: var(--faint-2); } .ycell.key .n { color: #fff; background: var(--gold); }
  .ycell.today:not(.key) { background: var(--sky-week); } .ycell.today:not(.key) .n { color: #fff; background: var(--sky); }
  .ycell .dw { flex-shrink: 0; font-size: 9px; line-height: 1.2; font-weight: 700; letter-spacing: -.02em; white-space: nowrap; overflow: hidden; margin: 0 -4px; padding: 0 2px 0 4px; color: var(--faint-2); }
  .ycell .dw.mon, .ycell .dw.today { color: var(--sky); } .ycell .dw.today { font-weight: 700; } .ycell .dw.key { color: var(--gold-txt); }
  .ycell .dots { display: flex; flex-wrap: wrap; gap: 2px; margin-top: 3px; max-height: 16px; overflow: hidden; }
  .ycell .dots i { width: 7px; height: 7px; border-radius: 50%; background: var(--c); border: 1.5px solid var(--c); }
  .ycell .dots i.unc { background: transparent; }
  .ycell .due { position: absolute; left: 0; right: 0; bottom: 0; height: 3px; background: var(--gold); }
  .legend { display: flex; flex-wrap: wrap; gap: 8px 20px; padding-top: 12px; font-size: 12px; color: var(--muted); }
  .legend .key { color: var(--gold-txt); font-weight: 600; }

  /* Coming up */
  .up { padding-top: 28px; display: flex; flex-direction: column; gap: 10px; }
  .upgrid { display: grid; grid-template-columns: repeat(auto-fill, minmax(220px, 1fr)); gap: 12px; }
  .upcard { border: 1px solid var(--line-2); border-radius: var(--r); padding: 12px 14px; display: flex; flex-direction: column; gap: 4px; cursor: pointer;
    background: #fff; text-align: left; transition: border-color .12s ease; }
  .upcard:hover { border-color: var(--faint-3); }
  .upcard .meta { display: flex; align-items: center; gap: 8px; font-size: 12px; color: var(--muted); }
  .upcard .meta i { width: 8px; height: 8px; border-radius: 50%; background: var(--c); }
  .upcard .meta b { color: var(--navy); }
  .upcard .title { font-size: 13px; font-weight: 600; line-height: 1.35; text-wrap: pretty; }

  /* ---------- Key deadlines (chains) ---------- */
  .mine { display: flex; flex-direction: column; gap: 12px; }
  .minegrid { display: grid; grid-template-columns: repeat(auto-fit, minmax(240px, 1fr)); gap: 12px; }
  .minecard { border: 1px solid var(--gold-bd); background: var(--gold-bg); border-radius: var(--r); padding: 16px 18px; display: flex; flex-direction: column; gap: 6px; cursor: pointer; text-align: left; transition: border-color .12s ease; }
  .minecard:hover { border-color: var(--gold); }
  .minecard .top { display: flex; justify-content: space-between; align-items: baseline; gap: 8px; }
  .minecard .when { font-size: 22px; font-weight: 700; color: var(--navy); } .minecard .rel { font-size: 13px; font-weight: 600; color: var(--gold-txt); }
  .minecard .label { font-size: 14px; font-weight: 600; line-height: 1.4; text-wrap: pretty; } .minecard .chainname { font-size: 12px; color: var(--muted); }
  .chainintro { display: flex; flex-wrap: wrap; gap: 12px 24px; justify-content: space-between; align-items: center; border-top: 1px solid var(--line); padding-top: 22px; }
  .chainintro p { margin: 0; font-size: 13px; line-height: 1.5; color: var(--body-2); max-width: 640px; text-wrap: pretty; }
  .seg { display: flex; background: #eef1f5; border-radius: var(--r); padding: 3px; gap: 2px; font-size: 13px; font-weight: 600; }
  .seg button { padding: 6px 14px; border-radius: 2px; cursor: pointer; background: transparent; color: var(--muted); border: 0; }
  .seg button.on { background: #fff; color: var(--navy); }
  .chaingrid { display: grid; grid-template-columns: repeat(auto-fill, minmax(min(460px, 100%), 1fr)); gap: 16px; align-items: start; }
  .chain { border: 1px solid var(--line-2); border-radius: var(--r); padding: 18px 20px 12px; display: flex; flex-direction: column; gap: 12px; min-width: 0; }
  .chain .head { display: flex; justify-content: space-between; align-items: center; gap: 12px; }
  .chain .head h3 { margin: 0; display: flex; align-items: center; gap: 10px; font-size: 15px; font-weight: 700; color: var(--navy); }
  .chain .head h3 i { width: 12px; height: 12px; border-radius: var(--r-s); background: var(--c); }
  .chain .head span { font-size: 12px; color: var(--muted); white-space: nowrap; }
  .chain .prog { height: 3px; background: #eef1f5; border-radius: 2px; overflow: hidden; } .chain .prog i { display: block; height: 100%; background: var(--navy); }
  .csteps { display: flex; flex-direction: column; }
  .cgap { display: grid; grid-template-columns: 84px 14px minmax(0, 1fr); gap: 0 12px; }
  .cgap i { justify-self: center; width: 2px; min-height: 14px; background: var(--line-2); } .cgap span { font-size: 11px; color: var(--faint); padding: 2px 0; }
  .cstep { display: grid; grid-template-columns: 84px 14px minmax(0, 1fr); gap: 0 12px; align-items: start; padding: 6px 8px; margin: 0 -8px; border-radius: var(--r);
    cursor: pointer; background: transparent; border: 0; text-align: left; width: calc(100% + 16px); transition: background .12s ease; }
  .cstep:hover { background: var(--surface); }
  .cstep.past { opacity: .5; } .cstep.next { background: var(--sky-next); } .cstep.key { background: var(--gold-bg); }
  .cstep .when { font-size: 13px; font-weight: 700; color: var(--navy); padding-top: 1px; }
  .cstep .dot { justify-self: center; width: 12px; height: 12px; margin-top: 3px; border-radius: 50%; background: var(--dc); box-shadow: 0 0 0 3px #fff, 0 0 0 4.5px transparent; }
  .cstep.key .dot { width: 14px; height: 14px; } .cstep.next .dot { box-shadow: 0 0 0 3px #fff, 0 0 0 4.5px var(--sky); } .cstep.past .dot { background: #c5ccd6; }
  .cstep .label { font-size: 13px; line-height: 1.45; text-wrap: pretty; } .cstep.key .label { font-weight: 700; }
  .tag { display: inline-block; font-size: 10px; font-weight: 700; letter-spacing: .06em; text-transform: uppercase; padding: 1px 7px; border-radius: var(--r-s); margin-right: 8px; }
  .tag.you { background: var(--gold-tag); color: var(--gold-txt); } .tag.office { background: #e9eef5; color: var(--navy); } .tag.exams { background: var(--sky-tint); color: #0b5d9c; } .tag.keyyou { background: var(--gold); color: #fff; }
  .pill { display: inline-block; white-space: nowrap; margin-left: 8px; font-size: 11px; font-weight: 700; border-radius: var(--r-s); padding: 1px 7px; }
  .pill.next { color: #fff; background: var(--sky); } .pill.unc { color: var(--gold-txt); background: var(--gold-tag); }
  .done { font-size: 13px; color: var(--muted); }

  /* ---------- By office (lanes) ---------- */
  .lanehead { display: flex; flex-wrap: wrap; gap: 8px 18px; justify-content: space-between; align-items: center; font-size: 13px; color: var(--body-2); }
  .lanehead .lgs { display: flex; flex-wrap: wrap; gap: 8px 16px; font-size: 12px; color: var(--muted); }
  .lanewrap { overflow-x: auto; }
  .lanes { min-width: 1180px; display: flex; flex-direction: column; --cols: 44; }
  .lrow { display: grid; grid-template-columns: 140px repeat(var(--cols), minmax(0, 1fr)); }
  .lrow.months > div { font-size: 12px; font-weight: 600; color: var(--navy); padding: 0 0 6px 4px; border-left: 1px solid var(--line-in); }

<script>
/* ==========================================================================
   EDIT HERE - the names and labels shown on the site.

   TO ADD OR RENAME AN OFFICE (a filter row + its colour layer):
     1. Add a line to OFFICES below:  key: 'Label shown in the sidebar',
     2. Use that same key as the `office:` value in data/events.yaml.
     3. Add a matching colour: OC below, and a --key variable in the stylesheet.
     4. Add its feed file to FEEDS (build.mjs generates msp-<key>.ics).
     5. Run  node build.mjs  and push.

   KEY DEADLINES: the hand-ins that get the gold treatment (the four from the
   28 Aug coordinator talk plus the planning form) are matched on the event id

const OFFICES = { exams: 'Exams', esd: 'ESD', scheduling: 'Scheduling', btr: 'BTR', boe: 'BoE', general: 'General' };

const ROLES = { all: 'All staff', academic: 'Academic', support: 'Support' };
const STAFF_LABEL = { academic: 'Academic staff', support: 'Support staff', both: 'Academic + support staff' };
const VIEWS = { year: 'Year planner', chains: 'Key deadlines', lanes: 'By office', grid: 'Month grid', timeline: 'Timeline' };
const VIEW_DESC = {
  year: 'The full academic year at a glance. Click any day for its deadlines.',
  chains: 'What you hand in, and what happens to it after.',
  lanes: 'What each office owes and waits on, week by week.',
  grid: 'One month at a time, every deadline in its day.',
  timeline: 'Every deadline in date order.',
};
const FEEDS = {
  'msp-all.ics': 'All offices', 'msp-academic-staff.ics': 'Academic staff', 'msp-support-staff.ics': 'Support staff',
  'msp-exams.ics': 'Exams', 'msp-esd.ics': 'ESD', 'msp-scheduling.ics': 'Scheduling', 'msp-btr.ics': 'BTR',
  'msp-boe.ics': 'BoE', 'msp-general.ics': 'General',
};
const KEY = (e) => e.key ? (e.key.charAt(0).toUpperCase() + e.key.slice(1)) :
  /^assessment-announced-/.test(e.id) ? 'Manual' : /^exam-submit-/.test(e.id) ? 'Exam' : /^(project-)?grades-due-/.test(e.id) ? 'Grade' :
  /^sched-planning-forms-.+-due$/.test(e.id) ? 'Plan' : /^accreditation-deadline-/.test(e.id) ? 'Archive' : '';
const KEYL = { Manual: 'Course manual on Canvas, with the assessment format', Exam: 'Exam to the Exams office', Grade: 'Grades to the Exams office',
  Plan: 'Planning form to Scheduling', Archive: 'Exam material for the archive' };
const CONTACT = 'msp-exams@maastrichtuniversity.nl';

let DB = null;

// ---------- state: URL params win, then localStorage, then defaults ----------
const _params = new URLSearchParams(location.search);
const _saved = (() => { try { return JSON.parse(localStorage.getItem('mspcal') || '{}'); } catch (_) { return {}; } })();
const _pick = (v, allowed, fb) => allowed.includes(v) ? v : fb;
const VIEW_KEYS = Object.keys(VIEWS);
const _offParam = _params.get('office');
const _initOn = _offParam ? _offParam.split(',').filter(k => OFFICES[k]) : (Array.isArray(_saved.on) ? _saved.on.filter(k => OFFICES[k]) : []);
const state = {
  on: new Set(_initOn.length ? _initOn : Object.keys(OFFICES)),
  view: _pick(_params.get('view'), VIEW_KEYS, _pick(_saved.view, VIEW_KEYS, window.innerWidth < 720 ? 'timeline' : 'year')),
  role: _pick(_params.get('role'), Object.keys(ROLES), _pick(_saved.role, Object.keys(ROLES), 'all')),
  q: '', panel: null, mineOnly: false,
};

  try { localStorage.setItem('mspcal', JSON.stringify({ on: [...state.on], view: state.view, role: state.role })); } catch (_) {}
  const p = new URLSearchParams();
  if (state.on.size < Object.keys(OFFICES).length) p.set('office', [...state.on].join(','));
  if (state.role !== 'all') p.set('role', state.role);
  if (state.view !== 'year') p.set('view', state.view);
  if (state.panel && state.panel.kind === 'event') p.set('event', state.panel.id);
  const qs = p.toString();
  try { history.replaceState(null, '', location.pathname + (qs ? '?' + qs : '')); } catch (_) {}
}

// ---------- dates (UTC throughout, so DST never moves a day) ----------
const D = (s) => new Date(s + 'T00:00:00Z');
const I = (d) => d.toISOString().slice(0, 10);
const add = (s, n) => { const d = D(s); d.setUTCDate(d.getUTCDate() + n); return I(d); };

const fmtDw = (s) => fmt(s, { weekday: 'short' }) + ' ' + fmt(s);
const fmtLong = (s) => fmt(s, { weekday: 'long', day: 'numeric', month: 'long', year: 'numeric' });
const monthKey = (s) => fmt(s, { month: 'long', year: 'numeric' });
function isoWeek(iso) {
  const d = D(iso); d.setUTCDate(d.getUTCDate() - ((d.getUTCDay() + 6) % 7) + 3);

}
const rel = (n) => n === 0 ? 'today' : n === 1 ? 'tomorrow' : n < 0 ? (-n) + ' days ago' : n < 14 ? 'in ' + n + ' days' : 'in ' + Math.round(n / 7) + ' weeks';
const gapText = (n) => n === 0 ? 'same day' : n === 1 ? 'the next day' : n === 7 ? 'a week later' : n % 7 === 0 ? (n / 7) + ' weeks later' : n + ' days later';
const esc = (s) => String(s == null ? '' : s).replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;').replace(/"/g, '&quot;');
const today = I(new Date());

// ---------- derived from the data ----------
let periods = [], hols = [], byId = {}, yS = '', yE = '', total = 1;
const perOf = (iso) => periods.find(p => iso >= p.start && iso <= p.end) || null;
const holOf = (iso) => hols.find(h => iso >= h.start && iso <= (h.end || h.start)) || null;
const isExam = (iso) => { const p = perOf(iso); return !!(p && p.exam_start && iso >= p.exam_start && iso <= p.exam_end); };
const isDue = (e) => e.submit || e.staff === 'academic';
const ok = (e) => state.on.has(e.office) && (state.role === 'all' || e.staff === state.role || e.staff === 'both' || !e.staff) &&
  (!state.q || (e.title + ' ' + (e.notes || '') + ' ' + (e.audience || '')).toLowerCase().includes(state.q));
const filtered = () => DB.events.filter(ok).sort((a, b) => a.date.localeCompare(b.date));

// ---------- clickable elements: mouse and keyboard alike ----------
function clickable(el, fn) {
  el.setAttribute('role', 'button'); el.tabIndex = 0;
  el.addEventListener('click', fn);
  el.addEventListener('keydown', (ev) => { if (ev.key === 'Enter' || ev.key === ' ') { ev.preventDefault(); fn(ev); } });
  return el;
}
const el = (tag, cls, html) => { const n = document.createElement(tag); if (cls) n.className = cls; if (html != null) n.innerHTML = html; return n; };

// ---------- sidebar ----------
let railManual = false;
const isNarrow = () => window.matchMedia('(max-width: 860px)').matches;
function setRail(mini) {
  const r = document.getElementById('rail'); r.classList.toggle('mini', !!mini); r.title = mini ? 'Open the menu' : '';
  const old = document.querySelector('.railscrim'); if (old) old.remove();
  if (!mini && isNarrow()) { const s = el('div', 'railscrim'); s.onclick = () => setRailManual(true); document.body.appendChild(s); }
}
function setRailManual(mini) { railManual = true; setRail(mini); try { localStorage.setItem('mspcal_rail', mini ? 'mini' : 'full'); } catch (_) {} }
function autoRail() { if (!railManual) setRail(isNarrow()); }

function buildRail() {
  const rail = document.getElementById('rail');
  rail.innerHTML = '';
  rail.onclick = () => { if (rail.classList.contains('mini')) setRailManual(false); };
  const top = el('div', 'railtop', '<img class="raillogo" src="um-logo.png" alt="Maastricht University">');
  const tg = el('button', 'railtoggle', '&#9776;'); tg.setAttribute('aria-label', 'Open or collapse the menu');

function setView(id) {
  if (!VIEWS[id]) return;
  state.view = id; state.panel = null; closePanel();
  syncState(); buildRail(); render();

}

// ---------- year bar ----------
function buildYearBar() {
  const bar = document.getElementById('ybar'); bar.innerHTML = '';
  if (!periods.length) return;
  const row = el('div', 'ybrow');
  let cur = yS;
  const seg = (grow, colour, label, tip, exL, exW) => {
    const s = el('div', 'ybseg'); s.style.flexGrow = grow; s.title = tip;
    if (colour) s.style.setProperty('--c', colour);
    s.innerHTML = `<div class="bar">${exW ? `<i style="left:${exL}%;width:${exW}%"></i>` : ''}</div><span class="lab">${label}</span>`;
    return s;
  };
  for (const p of periods) {
    const g = diff(cur, p.start);
    if (g > 1) row.appendChild(seg(g, null, '', 'No teaching'));
    const len = diff(p.start, p.end) + 1;
    const exL = p.exam_start ? diff(p.start, p.exam_start) / len * 100 : 0;
    const exW = p.exam_start ? (diff(p.exam_start, p.exam_end) + 1) / len * 100 : 0;
    const s = seg(len, PC[p.id] || '#001c3d', p.id, p.id + ': ' + fmt(p.start) + ' to ' + fmt(p.end) + (p.exam_start ? ' · exams ' + fmt(p.exam_start) + ' to ' + fmt(p.exam_end) : ''), exL, exW);
    clickable(s, () => { state.view = 'grid'; syncState(); buildRail(); render(); gotoMonth(p.start.slice(0, 7)); });
    row.appendChild(s);
    cur = p.end;
  }
  if (today >= yS && today <= yE) { const pct = diff(yS, today) / total * 100; const t = el('span', 'ybtoday' + (pct > 85 ? ' late' : ''), '<b>Today · ' + fmt(today) + '</b>'); t.style.left = pct + '%'; t.title = 'Today, ' + fmtDw(today); row.appendChild(t); }
  bar.appendChild(row);
  const ticks = el('div', 'ybticks');
  let m = new Date(Date.UTC(+yS.slice(0, 4), +yS.slice(5, 7), 1));
  while (I(m) <= yE) { const off = diff(yS, I(m)); if (off >= 0 && off < total) { const t = el('span', '', fmt(I(m), { month: 'short' })); t.style.left = (off / total * 100) + '%'; ticks.appendChild(t); } m = new Date(Date.UTC(m.getUTCFullYear(), m.getUTCMonth() + 1, 1)); }
  bar.appendChild(ticks);
  const cp = perOf(today);
  const now = cp ? `${cp.id} · ${fmt(cp.start)} – ${fmt(cp.end)}${cp.exam_start ? ' · exams ' + fmt(cp.exam_start) + ' – ' + fmt(cp.exam_end) : ''} · today is ${fmtDw(today)}, week ${isoWeek(today)}`
    : `Between teaching periods · today is ${fmtDw(today)}, week ${isoWeek(today)}`;
  bar.appendChild(el('div', 'ybstatus', `<span>${now}</span><span class="lgs"><span class="lg"><i style="width:14px;height:6px;background:var(--sky)"></i>Exam week</span><span class="lg"><i style="width:2px;height:12px;background:var(--gold)"></i>Today</span></span>`));
}

// ---------- render ----------
function render() {
  const main = document.getElementById('main');
  main.innerHTML = ''; main.className = state.view;
  document.getElementById('crumbview').textContent = VIEWS[state.view];
  document.getElementById('viewtitle').textContent = VIEWS[state.view];
  document.getElementById('viewdesc').textContent = VIEW_DESC[state.view];
  document.title = VIEWS[state.view] + ' · MSP Operations Calendar';
  const evs = filtered();
  if (!evs.length && state.view !== 'lanes') {
    main.appendChild(el('p', 'empty', (state.q ? `No deadlines match "${esc(state.q)}".` : 'No deadlines match this selection.') +
      `<br>Try turning an office back on, or clearing the search. If you expected something here, <a href="mailto:${CONTACT}?subject=MSP%20Operations%20Calendar">tell us</a>.`));
    return;
  }
  if (state.view === 'year') renderYear(main, evs);
  else if (state.view === 'chains') renderChains(main, evs);
  else if (state.view === 'lanes') renderLanes(main, evs);
  else if (state.view === 'grid') renderGrid(main, evs);
  else renderTimeline(main, evs);
}

function keyCard(e, cls) {
  const n = diff(today, e.date), k = KEY(e);
  const c = el('button', cls, `<div class="top"><span class="when">${fmt(e.date, { weekday: 'short', day: 'numeric', month: 'short' })}</span><span class="rel${n <= 14 ? ' soon' : ''}">${rel(n)}</span></div>` +
    `<div class="kind">${KEYL[k] || 'Key deadline'}</div><div class="title">${esc(e.title)}</div>`);
  c.onclick = () => openPanel({ kind: 'event', id: e.id });
  return c;
}

function renderYear(main, evs) {
  const byDate = {}; for (const e of evs) (byDate[e.date] = byDate[e.date] || []).push(e);
  const keys = evs.filter(e => e.date >= today && KEY(e)).slice(0, 4);
  if (keys.length) {
    const wrap = el('div', 'keyblock', '<div class="eyebrow gold">Key deadlines ahead</div>');
    const g = el('div', 'keygrid'); for (const e of keys) g.appendChild(keyCard(e, 'keycard'));
    wrap.appendChild(g); main.appendChild(wrap);
  }
  const wrap = el('div', 'ywrap'), grid = el('div', 'ygrid');
  let y = +yS.slice(0, 4), mo = +yS.slice(5, 7) - 1;
  for (let k = 0; k < 12; k++) {
    const first = I(new Date(Date.UTC(y, mo, 1))), n = new Date(Date.UTC(y, mo + 1, 0)).getUTCDate();
    const row = el('div', 'yrow');
    const ml = el('div', 'ymonth', `<b>${fmt(first, { month: 'short' })}</b><small>${y}</small>`);
    ml.title = 'Open ' + monthKey(first) + ' in the month grid';
    clickable(ml, () => { state.view = 'grid'; syncState(); buildRail(); render(); gotoMonth(first.slice(0, 7)); });
    row.appendChild(ml);
    for (let i = 0; i < 31; i++) {
      if (i >= n) { row.appendChild(el('div', 'ycell out')); continue; }
      const iso = add(first, i), wd = D(iso).getUTCDay(), we = wd === 0 || wd === 6;
      const p = perOf(iso), ex = isExam(iso), h = holOf(iso), de = byDate[iso] || [], isT = iso === today;
      const kl = (de.map(KEY).find(Boolean)) || '';
      const c = el('div', 'ycell' + (kl ? ' key' : ex ? ' exam' : h ? ' hol' : we ? ' wknd' : '') + (isT ? ' today' : ''));
      if (p) c.style.setProperty('--top', PC[p.id]);
      if (isT) c.style.setProperty('--ring', '#0e71bb'); else if (kl) c.style.setProperty('--ring', '#af6500');
      c.title = fmtDw(iso) + (h ? ' · ' + h.label : '') + (de.length ? ' · ' + de.length + ' deadline' + (de.length > 1 ? 's' : '') : '');
      c.innerHTML = `<span class="n">${i + 1}</span><span class="dw${kl ? ' key' : isT ? ' today' : wd === 1 ? ' mon' : ''}">${kl || (isT ? 'Today' : wd === 1 ? 'W' + isoWeek(iso) : 'SMTWTFS'[wd])}</span>` +
        `<div class="dots">${de.slice(0, 6).map(e => `<i class="${e.status === 'unconfirmed' ? 'unc' : ''}" style="--c:${OC[e.office]}"></i>`).join('')}</div>` +
        (de.some(isDue) ? '<span class="due"></span>' : '');
      clickable(c, () => openPanel({ kind: 'day', iso }));
      row.appendChild(c);
    }
    grid.appendChild(row);
    mo++; if (mo > 11) { mo = 0; y++; }
  }
  wrap.appendChild(grid); main.appendChild(wrap);
  main.appendChild(el('div', 'legend',
    `<span class="lg"><i style="width:14px;height:10px;background:var(--sky-tint);border:1px solid #cfe3f3"></i>Exam week</span>` +
    `<span class="lg"><i style="width:14px;height:10px;background:var(--holiday);border:1px solid #d7eadc"></i>Holiday or break</span>` +
    `<span class="lg key"><i style="width:14px;height:12px;background:var(--gold-cell);box-shadow:inset 0 0 0 2px var(--gold)"></i>Key deadline: manual, planning form, exam, grades, archive material</span>` +
    `<span class="lg"><i style="width:14px;height:3px;background:var(--gold)"></i>Academic staff hand something in</span>` +
    `<span class="lg"><i style="width:7px;height:7px;border-radius:50%;border:1.5px solid var(--muted)"></i>Unconfirmed</span>`));
  const up = evs.filter(e => e.date >= today && !KEY(e)).slice(0, 6);
  if (up.length) {
    const w = el('div', 'up', '<div class="eyebrow">Coming up</div>');
    const g = el('div', 'upgrid');
    for (const e of up) {
      const c = el('button', 'upcard', `<div class="meta"><i style="--c:${OC[e.office]}"></i><b>${fmtDw(e.date)}</b><span>${rel(diff(today, e.date))}</span></div><div class="title">${esc(e.title)}</div>`);
      c.onclick = () => openPanel({ kind: 'event', id: e.id });
      g.appendChild(c);
    }
    w.appendChild(g); main.appendChild(w);
  }
}

function renderChains(main) {
  const mine = [], chains = [], done = [];
  for (const ch of chainDefs()) {
    let steps = ch.steps.map(([id, who, label]) => ({ e: byId[id], who, label, id })).filter(x => x.e).sort((a, b) => a.e.date.localeCompare(b.e.date));
    if (!steps.length) continue;
    const all = steps.length, past = steps.filter(s => s.e.date < today).length;
    for (const s of steps) if (s.who === 'a' && s.e.date >= today) mine.push({ s, chain: ch.title });
    if (past === all) { done.push(ch.title); continue; }
    const nextDate = steps.find(s => s.e.date >= today).e.date;
    if (state.mineOnly) steps = steps.filter(s => s.who === 'a');
    const nextId = (steps.find(s => s.e.date >= today) || {}).id;
    chains.push({ ch, steps, all, past, nextId, sort: nextDate });
  }
  chains.sort((a, b) => a.sort.localeCompare(b.sort));
  mine.sort((a, b) => a.s.e.date.localeCompare(b.s.e.date));

  const mw = el('div', 'mine', '<div class="eyebrow gold">Your next deadlines</div>');
  const mg = el('div', 'minegrid');
  for (const { s, chain } of mine.slice(0, 3)) {
    const c = el('button', 'minecard', `<div class="top"><span class="when">${fmt(s.e.date, { weekday: 'short', day: 'numeric', month: 'short' })}</span><span class="rel">${rel(diff(today, s.e.date))}</span></div>` +
      `<div class="label">${esc(s.label)}</div><div class="chainname">${esc(chain)}</div>`);
    c.onclick = () => openPanel({ kind: 'event', id: s.e.id });
    mg.appendChild(c);
  }
  if (mine.length) { mw.appendChild(mg); main.appendChild(mw); }

  const intro = el('div', 'chainintro', `<p>The hand-off chains behind the big deadlines. <b style="color:var(--gold-txt)">Gold steps are yours</b> (academic staff), navy steps are what the office does with your input. Click a step for details.</p>`);
  const sg = el('div', 'seg', `<button class="${state.mineOnly ? '' : 'on'}">Full chain</button><button class="${state.mineOnly ? 'on' : ''}">My steps only</button>`);
  const [bf, bm] = sg.querySelectorAll('button');
  bf.onclick = () => { state.mineOnly = false; render(); }; bm.onclick = () => { state.mineOnly = true; render(); };
  intro.appendChild(sg); main.appendChild(intro);

  const grid = el('div', 'chaingrid');
  for (const { ch, steps, all, past, nextId } of chains) {
    const sec = el('section', 'chain');
    sec.innerHTML = `<div class="head"><h3><i style="--c:${ch.c}"></i>${esc(ch.title)}</h3><span>${past} of ${all} done</span></div><div class="prog"><i style="width:${past / all * 100}%"></i></div>`;
    const list = el('div', 'csteps');
    let prev = null;
    for (const s of steps) {
      if (prev) list.appendChild(el('div', 'cgap', `<span></span><i></i><span>${gapText(diff(prev, s.e.date))}</span>`));
      prev = s.e.date;
      const isPast = s.e.date < today, isNext = s.id === nextId, isKey = !!KEY(s.e);
      const T = isKey ? ['Key · You', 'keyyou', '#af6500'] : s.who === 'a' ? ['You', 'you', '#af6500'] : s.who === 'w' ? ['Exams', 'exams', '#0e71bb'] : ['Office', 'office', '#2d5a8a'];
      const row = el('button', 'cstep' + (isPast ? ' past' : '') + (isNext ? ' next' : '') + (isKey ? ' key' : ''));
      row.style.setProperty('--dc', T[2]);
      row.innerHTML = `<span class="when">${fmtDw(s.e.date)}</span><span class="dot"></span><span class="label"><span class="tag ${T[1]}">${T[0]}</span>${esc(s.label)}` +
        (isNext ? `<span class="pill next">Next · ${rel(diff(today, s.e.date))}</span>` : '') + (s.e.status === 'unconfirmed' ? '<span class="pill unc">Unconfirmed</span>' : '') + '</span>';
      row.onclick = () => openPanel({ kind: 'event', id: s.e.id });
      list.appendChild(row);
    }
    sec.appendChild(list); grid.appendChild(sec);
  }
  main.appendChild(grid);
  if (done.length) main.appendChild(el('div', 'done', 'Completed this year: ' + esc(done.join(', '))));
}

function renderLanes(main, evs) {
  const start = add(yS, -((D(yS).getUTCDay() + 6) % 7));
  const lastEv = DB.events.length ? DB.events[DB.events.length - 1].date : yE;
  const nWeeks = Math.max(44, Math.ceil((diff(start, lastEv > yE ? lastEv : yE) + 1) / 7));
  const weeks = [];
  for (let i = 0; i < nWeeks; i++) {
    const s = add(start, 7 * i), e = add(s, 6), p = perOf(s), ex = isExam(s), h = holOf(s), cur = today >= s && today <= e;
    weeks.push({ s, e, wk: isoWeek(s), thu: add(s, 3), p, ex, h, cur, tip: 'Week ' + isoWeek(s) + ' · ' + fmt(s) + ' – ' + fmt(e) + (h ? ' · ' + h.label : '') });
  }
  main.appendChild(el('div', 'lanehead', `<div>Click a week for its deadlines.</div><div class="lgs">` +
    `<span class="lg"><i style="width:10px;height:10px;border-radius:50%;background:var(--body-2)"></i>Deadlines that week</span>` +
    `<span class="lg" style="color:var(--gold-txt);font-weight:600"><i style="width:10px;height:10px;border-radius:50%;background:var(--gold)"></i>Key deadline that week</span>` +
    `<span class="lg"><i style="width:10px;height:10px;border-radius:50%;background:#fff;border:2px solid var(--gold)"></i>Includes academic staff hand-in</span>` +
    `<span class="lg"><i style="width:14px;height:10px;background:var(--sky-week)"></i>This week</span></div>`));
  const wrap = el('div', 'lanewrap'), lanes = el('div', 'lanes'); lanes.style.setProperty('--cols', nWeeks);
  const mh = []; for (const w of weeks) { const l = fmt(w.thu, { month: 'short' }); const last = mh[mh.length - 1]; if (last && last.l === l) last.span++; else mh.push({ l, span: 1 }); }
  lanes.appendChild(el('div', 'lrow months', '<div></div>' + mh.map(m => `<div style="grid-column:span ${m.span}">${m.l}</div>`).join('')));
  lanes.appendChild(el('div', 'lrow period', '<div>Period</div>' + weeks.map(w => `<div class="pw" title="${esc(w.tip)}" style="--pc:${w.p ? (w.ex ? '#0e71bb' : PC[w.p.id]) : 'var(--gap)'}">${w.p ? (w.ex ? 'Ex' : (w.p.start >= w.s && w.p.start <= w.e ? w.p.id : '')) : ''}</div>`).join('')));
  lanes.appendChild(el('div', 'lrow weeks', '<div>Week</div>' + weeks.map(w => `<div class="wn" style="background:${w.cur ? 'var(--sky-week)' : w.h ? '#f2f6f1' : 'transparent'}">${w.wk}</div>`).join('')));
  for (const k of Object.keys(OFFICES).filter(k => state.on.has(k))) {
    const mine = evs.filter(e => e.office === k);
    const row = el('div', 'lrow lane', `<div class="ll"><i style="--c:${OC[k]}"></i>${OFFICES[k]}<small>${mine.length}</small></div>`);
    for (const w of weeks) {
      const list = mine.filter(e => e.date >= w.s && e.date <= w.e), n = list.length;
      const cell = el('button', 'wc' + (w.cur ? ' cur' : w.h ? ' hol' : '') + (n ? ' has' : ''));
      cell.title = n ? n + ' deadline' + (n > 1 ? 's' : '') + ', week ' + w.wk : w.tip;
      cell.style.setProperty('--sz', n ? Math.min(8 + n * 3, 20) + 'px' : '0px');
      cell.style.setProperty('--fill', list.some(KEY) ? '#af6500' : n ? OC[k] : 'transparent');
      cell.style.setProperty('--ringc', n && list.some(isDue) ? '#af6500' : 'transparent');
      cell.innerHTML = `<b>${n > 1 ? n : ''}</b>`;
      if (n) cell.onclick = () => openPanel({ kind: 'week', office: k, s: w.s }); else cell.tabIndex = -1;
      row.appendChild(cell);
    }
    lanes.appendChild(row);
  }
  lanes.appendChild(el('div', 'end'));
  wrap.appendChild(lanes); main.appendChild(wrap);
}

function gotoMonth(ym) { const sec = document.getElementById('m-' + ym); if (sec) sec.scrollIntoView({ behavior: 'smooth', block: 'start' }); }

function renderGrid(main, evs) {
  const byDay = {}; for (const e of evs) (byDay[e.date] = byDay[e.date] || []).push(e);
  const first = evs[0].date < yS ? evs[0].date : yS, last = evs[evs.length - 1].date > yE ? evs[evs.length - 1].date : yE;
  let y = +first.slice(0, 4), m = +first.slice(5, 7);
  const endY = +last.slice(0, 4), endM = +last.slice(5, 7);
  while (y < endY || (y === endY && m <= endM)) {
    const ym = `${y}-${String(m).padStart(2, '0')}`;
    const section = el('section', 'month', `<h2>${monthKey(ym + '-01')}</h2>`); section.id = 'm-' + ym;
    const grid = el('div', 'calgrid');
    for (const d of ['Mon', 'Tue', 'Wed', 'Thu', 'Fri', 'Sat', 'Sun']) grid.appendChild(el('div', 'dowhead', d));
    const firstDow = (D(ym + '-01').getUTCDay() + 6) % 7;
    for (let i = 0; i < firstDow; i++) grid.appendChild(el('div', 'day out'));
    const n = new Date(Date.UTC(y, m, 0)).getUTCDate();
    for (let d = 1; d <= n; d++) {
      const iso = `${ym}-${String(d).padStart(2, '0')}`, dow = (firstDow + d - 1) % 7, de = byDay[iso] || [];
      const p = perOf(iso), h = holOf(iso), kl = de.map(KEY).find(Boolean);
      const cell = el('div', 'day' + (kl ? ' key' : isExam(iso) ? ' exam' : h ? ' hol' : dow >= 5 ? ' wknd' : '') + (iso === today ? ' today' : ''));
      if (p) cell.style.setProperty('--top', PC[p.id]);
      if (h) cell.title = h.label;
      cell.innerHTML = `<div class="num"><span>${d}</span>${iso === today ? '<small>Today</small>' : dow === 0 ? `<small title="ISO week ${isoWeek(iso)}">W${isoWeek(iso)}</small>` : ''}</div>`;
      for (const e of de) {
        const b = el('button', 'ev' + (e.status === 'unconfirmed' ? ' unc' : ''), esc(e.title));
        b.style.setProperty('--c', OC[e.office]); b.title = e.title;
        b.onclick = (ev) => { ev.stopPropagation(); openPanel({ kind: 'event', id: e.id }); };
        cell.appendChild(b);
      }
      if (de.some(isDue)) cell.appendChild(el('span', 'due'));
      clickable(cell, () => openPanel({ kind: 'day', iso }));
      grid.appendChild(cell);
    }
    section.appendChild(grid); main.appendChild(section);
    m++; if (m > 12) { m = 1; y++; }
  }
}

function renderTimeline(main, evs) {
  let cur = null, sec = null, todayDrawn = today < evs[0].date;
  for (const e of evs) {
    const mk = monthKey(e.date);
    if (mk !== cur) { cur = mk; sec = el('section', 'month', `<h2>${mk}</h2>`); sec.id = 'm-' + e.date.slice(0, 7); main.appendChild(sec); }
    if (!todayDrawn && e.date >= today) { sec.appendChild(el('hr', 'today-rule')); todayDrawn = true; }
    const b = el('button', 'event' + (e.date < today ? ' past' : '') + (e.status === 'unconfirmed' ? ' unc' : ''));
    b.style.setProperty('--c', OC[e.office]);
    b.innerHTML = `<div class="date">${fmt(e.date)}<small>${fmt(e.date, { weekday: 'short' })}</small></div><div class="body"><span class="title">${esc(e.title)}</span>` +
      `<span class="otag">${OFFICES[e.office] || e.office}</span>${e.status === 'unconfirmed' ? '<span class="pill unc">Unconfirmed</span>' : ''}` +
      ((e.notes || e.audience) ? `<div class="meta">${esc([e.notes, e.audience && 'For: ' + e.audience].filter(Boolean).join(' · '))}</div>` : '') + '</div>';
    b.onclick = () => openPanel({ kind: 'event', id: e.id });
    sec.appendChild(b);
  }
}

// ---------- detail panel ----------
function sendReport(subject, text, footer) {
  const body = (text.trim() || '(no comment typed)') + '\n\n' + footer;
  location.href = 'mailto:' + CONTACT + '?subject=' + encodeURIComponent(subject) + '&body=' + encodeURIComponent(body);
}
function closePanel() {
  for (const s of document.querySelectorAll('.scrim, .panel')) s.remove();
  if (state.panel) { state.panel = null; syncState(); }
}
function openPanel(pn) {
  closePanel(); state.panel = pn; syncState();
  const scrim = el('div', 'scrim'); scrim.onclick = closePanel;
  const panel = el('aside', 'panel'); panel.setAttribute('aria-modal', 'true'); panel.setAttribute('role', 'dialog');
  const head = (c, kicker, title, sub) => `<div class="phead" style="--c:${c}"><div class="kick"><span>${kicker}</span><button class="close" aria-label="Close">✕</button></div><h2>${title}</h2><div class="sub">${sub}</div></div>`;
  const item = (e) => { const b = el('button', 'pitem', `<span class="m"><b>${fmtDw(e.date)}</b> · ${OFFICES[e.office] || e.office}</span><span class="t">${esc(e.title)}</span>`); b.style.setProperty('--c', OC[e.office]); b.onclick = () => openPanel({ kind: 'event', id: e.id }); return b; };
  if (pn.kind === 'event') {
    const e = byId[pn.id]; if (!e) { state.panel = null; return; }
    const p = perOf(e.date), k = KEY(e);
    const webcal = new URL('feeds/msp-' + e.office + '.ics', location.href).href.replace(/^https?:/, 'webcal:');
    const rows = [['For', STAFF_LABEL[e.staff] || e.staff], ['Audience', e.audience], ['In', rel(diff(today, e.date))],
      ['Owner', e.owner]].filter(r => r[1]);
    panel.innerHTML = head(k ? '#af6500' : OC[e.office], esc((k ? 'Key deadline · ' + KEYL[k] + ' · ' : '') + (OFFICES[e.office] || e.office) + (e.status === 'unconfirmed' ? ' · unconfirmed' : '')), esc(e.title),
      esc(fmtLong(e.date) + (e.end && e.end !== e.date ? ' – ' + fmtLong(e.end) : '') + ' · week ' + isoWeek(e.date) + (p ? ' · ' + p.id : ''))) +
      `<div class="pbody"><div>${rows.map(r => `<div class="prow"><b>${r[0]}</b><span>${esc(r[1])}</span></div>`).join('')}</div>` +
      (e.notes ? `<p class="pnotes">${esc(e.notes)}</p>` : '') +
      `<a class="pfeed" href="https://outlook.office.com/calendar/0/addfromweb?url=${encodeURIComponent(webcal)}&name=${encodeURIComponent('MSP ' + (OFFICES[e.office] || e.office))}" target="_blank" rel="noopener">Subscribe to ${OFFICES[e.office] || e.office} in Outlook</a>` +
      `<div class="report"><label class="eyebrow" for="rep-txt">Spotted a wrong date, or have a comment?</label><textarea id="rep-txt" rows="3" placeholder="What should it be, and how do you know?"></textarea>` +
      `<button class="btn" id="rep-send" type="button">Send by email</button><small>Opens in your mail app, addressed to the Operations desk, with this deadline already in the subject.</small></div></div>`;
    panel.querySelector('#rep-send').onclick = () => sendReport('Date check: ' + e.title + ' (' + e.date + ')', panel.querySelector('#rep-txt').value,
      'Deadline: ' + e.title + ' (' + e.date + ', id ' + e.id + ')\nPage: ' + location.origin + location.pathname + '?event=' + encodeURIComponent(e.id));
  } else if (pn.kind === 'day') {
    const list = DB.events.filter(e => e.date === pn.iso && ok(e)), h = holOf(pn.iso), p = perOf(pn.iso);
    panel.innerHTML = head('#0e71bb', 'Week ' + isoWeek(pn.iso) + (p ? ' · ' + p.id : '') + (isExam(pn.iso) ? ' · exam week' : ''), fmtLong(pn.iso), esc(h ? h.label : (list.length ? list.length + ' deadline' + (list.length > 1 ? 's' : '') : 'No deadlines')));
    const body = el('div', 'plist');
    if (!list.length) body.appendChild(el('div', 'pempty', 'No deadlines match the current filters.'));
    for (const e of list) body.appendChild(item(e));
    const deiDay = (DB.dei && DB.dei.days && DB.dei.days[pn.iso]) || [], deiMonth = (DB.dei && DB.dei.months && DB.dei.months[pn.iso.slice(0, 7)]) || [];
    if (deiDay.length || deiMonth.length) body.appendChild(el('div', 'dei', '<span class="eyebrow">Diversity, Equity and Inclusion</span>' + deiDay.map(l => `<span class="chip">${esc(l)}</span>`).join('') + (deiMonth.length ? `<div class="mo">${esc(deiMonth.join(' · '))}</div>` : '')));
    panel.appendChild(body);
  } else {
    const e = add(pn.s, 6), list = filtered().filter(x => x.office === pn.office && x.date >= pn.s && x.date <= e);
    panel.innerHTML = head(OC[pn.office], OFFICES[pn.office], 'Week ' + isoWeek(pn.s), fmt(pn.s) + ' – ' + fmt(e, { day: 'numeric', month: 'short', year: 'numeric' }));
    const body = el('div', 'plist');
    if (!list.length) body.appendChild(el('div', 'pempty', 'No deadlines match the current filters.'));
    for (const x of list) body.appendChild(item(x));
    panel.appendChild(body);
  }
  panel.querySelector('.close').onclick = closePanel;
  document.body.appendChild(scrim); document.body.appendChild(panel);
  panel.querySelector('.close').focus();
}
document.addEventListener('keydown', (ev) => { if (ev.key === 'Escape') { closePanel(); const o = document.querySelector('.overlay'); if (o) o.remove(); } });

// ---------- subscribe dialog (unchanged flow: one click for UM Outlook, webcal, Google, copy) ----------
function showSubscribeCard(feed) {
  const label = FEEDS[feed] || feed;
  const httpsUrl = new URL('feeds/' + feed, location.href).href;
  if (!location.protocol.startsWith('http')) { location.href = 'feeds/' + feed; return; }
  const webcal = httpsUrl.replace(/^https?:/, 'webcal:');
  const old = document.querySelector('.overlay'); if (old) old.remove();
  const overlay = el('div', 'overlay'), card = el('div', 'card');
  card.innerHTML = `<div class="phead"><div class="kick"><span>Subscribe · updates arrive automatically</span><button class="close" aria-label="Close">✕</button></div><h2>MSP deadlines: ${esc(label)}</h2></div>` +
    `<div class="cbody">` +
    `<a class="subrow primary" href="https://outlook.office.com/calendar/0/addfromweb?url=${encodeURIComponent(webcal)}&name=${encodeURIComponent('MSP ' + label)}" target="_blank" rel="noopener">UM Outlook (Microsoft 365)<small>One click: opens Outlook on the web with this calendar ready to add</small></a>` +
    `<a class="subrow" href="${webcal}">Apple Calendar / Outlook desktop<small>Opens your default calendar app via webcal</small></a>` +
    `<a class="subrow" href="https://calendar.google.com/calendar/r?cid=${encodeURIComponent(webcal)}" target="_blank" rel="noopener">Google Calendar<small>For private devices</small></a>` +
    `<button class="subrow" id="subcopy">Copy the feed URL<small>Paste it into any calendar app's subscribe-from-web option</small></button></div>`;
  overlay.appendChild(card);
  overlay.onclick = (ev) => { if (ev.target === overlay) overlay.remove(); };
  card.querySelector('.close').onclick = () => overlay.remove();
  card.querySelector('#subcopy').onclick = (ev) => {
    const btn = ev.currentTarget;
    navigator.clipboard.writeText(httpsUrl).then(() => { btn.firstChild.textContent = 'Copied!'; setTimeout(() => { btn.firstChild.textContent = 'Copy the feed URL'; }, 1400); })
      .catch(() => { prompt('Feed URL:', httpsUrl); });
  };
  document.body.appendChild(overlay);
}

// ---------- boot ----------
function init() {
  periods = DB.periods.slice().sort((a, b) => a.start.localeCompare(b.start));
  hols = DB.holidays || [];
  for (const e of DB.events) byId[e.id] = e;
  yS = periods[0].start; yE = periods[periods.length - 1].end; total = diff(yS, yE) + 1;
  document.getElementById('printstamp').textContent = 'MSP Operations Calendar · academic year ' + DB.year + ' · printed from data updated ' + DB.generated;
  document.getElementById('footline').textContent = 'Academic year ' + DB.year + ' · data updated ' + fmt(DB.generated, { day: 'numeric', month: 'long', year: 'numeric' }) +
    ' · ' + DB.events.length + ' deadlines, ' + DB.events.filter(e => e.status !== 'confirmed').length + ' awaiting confirmation';
  document.getElementById('foot-send').onclick = () => sendReport('MSP Operations Calendar: comment', document.getElementById('foot-txt').value, 'Page: ' + location.origin + location.pathname + location.search);
  const feeds = document.getElementById('feeds');
  for (const [f, l] of Object.entries(FEEDS)) { const b = el('button', '', l); b.onclick = () => showSubscribeCard(f); feeds.appendChild(b); }
  const search = document.getElementById('search');
  search.oninput = () => { state.q = search.value.trim().toLowerCase(); render(); };
  document.getElementById('printbtn').onclick = () => { if (state.view !== 'year') setView('year'); setTimeout(() => window.print(), 150); };
  for (const a of [document.getElementById('homelink'), document.querySelector('.mspmark')]) a.onclick = (ev) => { ev.preventDefault(); state.q = ''; search.value = ''; setView('year'); };
  const savedRail = (() => { try { return localStorage.getItem('mspcal_rail'); } catch (_) { return null; } })();
  buildRail(); buildYearBar();
  if (savedRail) { railManual = true; setRail(savedRail === 'mini'); } else autoRail();
  window.addEventListener('resize', autoRail);
  syncState(); render();
  const evId = _params.get('event');
  if (evId && byId[evId]) openPanel({ kind: 'event', id: evId });
  if ((state.view === 'timeline' || state.view === 'grid') && today > yS) setTimeout(() => { const t = document.querySelector('.today-rule, .day.today'); if (t) t.scrollIntoView({ block: 'center', behavior: 'instant' }); }, 200);
}
window.onerror = (msg) => { document.getElementById('main').innerHTML = `<p class="empty">Sorry, something went wrong loading the calendar. Please let us know: ${esc(msg)}</p>`; };
if (window.MSP_EVENTS) { DB = window.MSP_EVENTS; init(); }
else fetch('events.json').then(r => r.json()).then(db => { DB = db; init(); })
  .catch(() => { document.getElementById('main').innerHTML = '<p class="empty">The calendar data could not be loaded. Please refresh, and tell us if it keeps happening.</p>'; });
</script>
